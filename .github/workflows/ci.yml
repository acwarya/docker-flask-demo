name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t docker-flask-demo:ci .

      - name: Scan image for vulnerabilities (Trivy)
        # Run Trivy from its official image so the full output shows in the log.
        # exit-code 0 = report only. Change to 1 to fail the build on findings.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            docker-flask-demo:ci

      - name: Integration smoke test (docker compose)
        run: |
          docker compose up -d --build web redis
          for i in $(seq 1 20); do
            curl -sf localhost:5000/ready && break || sleep 2
          done
          curl -sf localhost:5000/ | grep "Hello from Docker"
          curl -sf localhost:5000/metrics | grep http_requests_total
          docker compose down -v